# ==============================================================================
# MedraLink EMR Platform - Fly.io Deployment Configuration
# ==============================================================================
app = "medralink-emr"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  DB_DIALECT = "sqlite"
  SQLITE_PATH = "/data/medralink.sqlite"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[mounts]
  source = "medralink_data"
  destination = "/data"

# ==============================================================================
# MedraLink EMR Platform - Render Blueprint Specification
# Backend API on Render, database on Supabase (ap-southeast-2), frontend on Netlify.
# ==============================================================================
services:
  - type: web
    name: medralink-api
    runtime: node
    plan: free
    region: singapore # closest Render region to the Supabase database in Sydney
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false # Supabase IPv4 Session pooler string, entered in the Render dashboard
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # the Netlify site URL, e.g. https://medralink.netlify.app

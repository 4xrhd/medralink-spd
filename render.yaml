# ==============================================================================
# MedraLink EMR Platform - Render Blueprint Specification
# ==============================================================================
services:
  - type: web
    name: medralink-app
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: medralink-db
          property: connectionString
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: medralink-db
    databaseName: medralink
    user: medra_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16

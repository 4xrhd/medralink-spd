name: MedraLink CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            prototype/package-lock.json
            prototype/server/package-lock.json
            prototype/client/package-lock.json

      - name: Install Server Dependencies
        run: cd prototype/server && npm ci

      - name: Run Backend Automated Test Suite
        run: cd prototype/server && npm test

      - name: Install Client Dependencies
        run: cd prototype/client && npm ci

      - name: Build Frontend Client (Vite)
        run: cd prototype/client && npm run build

      - name: Build Backend Server (TypeScript)
        run: cd prototype/server && npm run build

  docker-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MedraLink Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./prototype
          file: ./prototype/Dockerfile
          push: false
          tags: medralink:ci-test

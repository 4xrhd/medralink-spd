# ==============================================================================
# MedraLink EMR Platform - Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream medralink_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect all HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name emr.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emr.yourdomain.com;

    # SSL Certificates (Managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/emr.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emr.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/emr.yourdomain.com/chain.pem;

    # TLS Protocol Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max upload limit for diagnostic reports & medical PDFs
    client_max_body_size 50M;

    # Gzip Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Reverse Proxy to MedraLink Node.js Service
    location / {
        proxy_pass http://medralink_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets long-term caching
    location /assets/ {
        proxy_pass http://medralink_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Health check bypass logging
    location = /api/health {
        proxy_pass http://medralink_upstream;
        proxy_set_header Host $host;
        access_log off;
    }
}

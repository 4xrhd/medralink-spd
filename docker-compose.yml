version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medralink-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_DIALECT: postgres
      DATABASE_URL: postgresql://medra_user:medra_secure_password_2026@postgres:5432/medralink
      AUTO_SEED: "true"
      JWT_SECRET: medralink_production_vault_secret_key_2026
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    volumes:
      - medralink_uploads:/app/uploads
      - medralink_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: medralink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medra_user
      POSTGRES_PASSWORD: medra_secure_password_2026
      POSTGRES_DB: medralink
    ports:
      - "5432:5432"
    volumes:
      - medralink_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medra_user -d medralink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medralink_pgdata:
  medralink_uploads:
  medralink_data:

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medralink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medra_user
      POSTGRES_PASSWORD: medra_secure_password_2026
      POSTGRES_DB: medralink
    ports:
      - "5432:5432"
    volumes:
      - medralink_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medra_user -d medralink"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medralink-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: medralink_secure_academic_jwt_secret_2026
      DB_DIALECT: postgres
      DATABASE_URL: postgresql://medra_user:medra_secure_password_2026@postgres:5432/medralink
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

volumes:
  medralink_pgdata:

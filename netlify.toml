[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# One-click demo accounts on the login page are off in production; set "true" only for a local demo
[build.environment]
  VITE_DEMO_MODE = "false"

# The API runs on Render (render.yaml). Proxying keeps the browser on one origin,
# so relative /api links (PDF downloads, lab report files) work without CORS.
[[redirects]]
  from = "/api/*"
  to = "https://medralink-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
